<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Neue Reservierung</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 40px 48px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e8eaf0;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #555;
            margin-bottom: 5px;
            margin-top: 16px;
        }

        input, select, textarea {
            display: block;
            width: 500px;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #1a1a2e;
            background: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #4f6ef7;
            box-shadow: 0 0 0 3px rgba(79,110,247,0.12);
            background: white;
        }

        button[type="submit"] {
            margin-top: 28px;
            width: 500px;
            padding: 12px;
            background: #4f6ef7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button[type="submit"]:hover { background: #3a56d4; }
        button[type="submit"]:active { transform: scale(0.98); }

        .error-box {
            background: #fff3f3;
            border: 1px solid #e74c3c;
            border-left: 4px solid #e74c3c;
            color: #c0392b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .error-box strong { display: block; margin-bottom: 4px; }

        .links {
            margin-top: 24px;
            text-align: center;
            font-size: 0.9rem;
        }

        .links a {
            color: #4f6ef7;
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover { text-decoration: underline; }

        /* Nur für reservation-list */
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.9rem; }
        thead { background: #f5f6fa; }
        th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid #e8eaf0;
        }
        td { padding: 12px 14px; border-bottom: 1px solid #f0f0f0; color: #333; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f9faff; }

        .filter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .filter-row select { width: auto; min-width: 240px; }
    </style>
</head>
<body>

<h1>Neue Reservierung</h1>

<div class="error-box" th:if="${error}" th:text="${error}"></div>


<form method="post" th:action="@{/reservations/save}" th:object="${reservation}">

    <label>Patient:</label>
    <select th:field="*{patient.svn}">
        <option th:each="p : ${patients}" th:value="${p.svn}"
                th:text="${p.firstName} + ' ' + ${p.lastName}"></option>
    </select>

    <label>Gerät:</label>
    <select th:field="*{device.designation}">
        <option th:each="d : ${devices}"
                th:value="${d.designation}"
                th:text="${d.designation} + ' - ' + ${d.type}">
        </option>
    </select>

    <label>Untersuchungszeit:</label>
    <input type="datetime-local" th:field="*{reservationTime}">

    <label>Körperregion:</label>
    <select th:field="*{bodyRegion}">
        <option value="Kopf">Kopf</option>
        <option value="Hals">Hals</option>
        <option value="Brust">Brust</option>
        <option value="Bauch">Bauch</option>
        <option value="Wirbelsäule">Wirbelsäule</option>
        <option value="Becken">Becken</option>
        <option value="Arm">Arm</option>
        <option value="Bein">Bein</option>
    </select>

    <label>Kommentar:</label>
    <textarea th:field="*{comment}" rows="3"></textarea>

    <br>
    <button type="submit">Speichern</button>
</form>

<br>
<a href="/patient">Neuen Patienten registrieren</a>

</body>
</html>
